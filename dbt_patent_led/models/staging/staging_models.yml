
version: 2

models:


  - name: stg_ipc_title_list
    description: "Normalized IPC title seed staged from official IPC title list text files."
    columns:
      - name: ipc_code
        description: "Normalized IPC symbol from official IPC title list."
        tests:
          - not_null

      - name: hierarchy_level_raw
        description: "Raw hierarchy level value parsed from IPC title list source."

      - name: title_text
        description: "Official IPC title text from title list."
        tests:
          - not_null

      - name: source_file
        description: "Original IPC title list source file name."

  - name: stg_cpc_title_list
    description: "Normalized CPC title seed staged from official CPC title list text files."
    columns:
      - name: cpc_code
        description: "Normalized CPC symbol from official title list."
        tests:
          - not_null

      - name: hierarchy_level_raw
        description: "Raw hierarchy level value parsed from CPC title list source."

      - name: title_text
        description: "Official CPC title text from title list."
        tests:
          - not_null

      - name: source_file
        description: "Original CPC title list source file name."

  - name: stg_cpc_validity
    description: "Normalized CPC validity seed staged from official CPC validity file."
    columns:
      - name: cpc_code
        description: "Normalized CPC symbol from official validity file."
        tests:
          - not_null

      - name: valid_from_date
        description: "Date from which the CPC symbol is valid."

      - name: valid_to_date
        description: "Date until which the CPC symbol remains valid, if any."

  - name: stg_rawdata_patents
    columns:
      - name: publication_number
        tests:
          - not_null

  - name: stg_raw_pub_to_family_id_v2
    columns:
      - name: publication_number
        tests:
          - not_null
      - name: family_id
        tests:
          - not_null

  - name: stg_publication_ipc
    columns:
      - name: publication_number
        tests:
          - not_null

  - name: stg_publication_applicant_raw
    columns:
      - name: publication_number
        tests:
          - not_null
      - name: applicant_seq
        tests:
          - not_null

  - name: stg_publication_inventor_raw
    columns:
      - name: publication_number
        tests:
          - not_null
      - name: inventor_seq
        tests:
          - not_null

  - name: stg_ops_family_members
    description: "Raw OPS family-member expansion source. Passthrough staging model; raw member publication fields are not yet canonicalized."
    columns:
      - name: member_publication_docdb_clean

      - name: member_publication_number_clean

      - name: ops_family_member_key
        tests:
          - not_null
          - unique

      - name: ops_family_member_row_id
        tests:
          - not_null
          - unique

      - name: ops_family_id
        tests:
          - not_null

      - name: seed_publication_number
        tests:
          - not_null

      - name: seed_publication_docdb

      - name: family_members_count
        tests:
          - not_null

      - name: member_seq_within_ops_family
        tests:
          - not_null

      - name: member_publication_docdb
        tests:
          - not_null

      - name: member_publication_number
        tests:
          - not_null

      - name: member_jurisdiction
        tests:
          - not_null

      - name: member_kind
        tests:
          - not_null

      - name: source_file_name
        tests:
          - not_null

      - name: ingested_at
        tests:
          - not_null

  - name: stg_publication_dates
    description: "Publication-grain normalized date helper built from stg_rawdata_patents actual available columns."
    columns:
      - name: publication_number
        tests:
          - not_null
          - unique

      - name: family_id
        tests:
          - not_null

      - name: grant_number

      - name: priority_date

      - name: application_date

      - name: publication_date

      - name: date_order_flag
        tests:
          - accepted_values:
              arguments:
                values:
                  - ok
                  - priority_after_publication
                  - application_after_publication

      - name: date_quality_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - ok
                  - missing_pub_date
                  - missing_pub_date_grant_side
                  - invalid_order
  - name: dim_country
    description: "Minimal authority/country lookup dimension for landscape analysis."
    columns:
      - name: authority_code
        tests:
          - not_null
          - unique

      - name: country_code
        tests:
          - not_null

      - name: is_pragmatic_fill
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
  - name: stg_publication_country
    description: "Publication-grain authority/country helper derived from publication number prefix."
    columns:
      - name: publication_number
        tests:
          - not_null
          - unique

      - name: authority_code
        tests:
          - not_null