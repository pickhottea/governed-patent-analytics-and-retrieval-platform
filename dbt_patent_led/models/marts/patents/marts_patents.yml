version: 2

models:
  - name: bridge_family_ops_cluster
    description: Family-to-OPS cluster bridge for governed family expansion.
    columns:
      - name: family_id
        tests:
          - not_null
          - unique
      - name: ops_family_cluster_id
        tests:
          - not_null

  - name: dim_publication
    description: Canonical publication dimension.
    columns:
      - name: publication_number
        tests:
          - not_null
          - unique

  - name: dim_ipc
    description: IPC hierarchy dimension.
    columns:
      - name: ipc_code
        tests:
          - not_null
          - unique

  - name: bridge_family_publication
    description: Family-to-publication bridge.
    columns:
      - name: family_id
        tests:
          - not_null
      - name: publication_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_publication')
                field: publication_number
      - name: member_role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['anchor', 'expanded_member']

  - name: bridge_publication_ipc
    description: Publication-to-IPC bridge.
    columns:
      - name: publication_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_publication')
                field: publication_number
      - name: ipc_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ipc')
                field: ipc_code

  - name: fact_publication_applicant
    description: Publication x applicant fact.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - publication_number
              - applicant_seq
    columns:
      - name: publication_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_publication')
                field: publication_number
      - name: applicant_seq
        tests:
          - not_null

  - name: fact_publication_inventor
    description: Publication x inventor fact.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - publication_number
              - inventor_seq
    columns:
      - name: publication_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_publication')
                field: publication_number
      - name: inventor_seq
        tests:
          - not_null

  - name: bm25_document
    description: Publication-grain BM25 serving table.
    columns:
      - name: publication_number
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_publication')
                field: publication_number